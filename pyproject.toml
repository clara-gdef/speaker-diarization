[project]
name = "diarization"
version = "0.1.0"
dependencies = [
    "numpy>=1.23,<2.0",
    "librosa>=0.10,<0.11",
    "torch==1.13.1",
    "speechbrain>=1.0.0,<2.0.0",
    "onnxruntime>=1.16,<2.0",
    "scikit-learn>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ipdb",
    "matplotlib>=3.6,<4.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
